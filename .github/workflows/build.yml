name: Build GePatch_mh

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PRX
        run: |
          make clean || true
          make -j2
          test -f ge_mh_patch.prx

      - name: Upload ge_mh_patch.prx
        uses: actions/upload-artifact@v4
        with:
          name: ge_mh_patch
          path: ge_mh_patch.prx
          if-no-files-found: error
